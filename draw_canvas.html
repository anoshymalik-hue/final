<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drawing App</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#0f172a;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:25px;
      height:100vh;
    }

    /* Toolbar */

    .toolbar{
      width:90%;
      max-width:950px;
      background:#1e293b;
      padding:18px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    /* Color Picker */

    .color-box{
      display:flex;
      align-items:center;
      gap:8px;
      color:white;
      font-size:16px;
    }

    .color-box input{
      width:50px;
      height:50px;
      border:none;
      cursor:pointer;
      background:none;
    }

    /* Brush Size */

    .slider-box{
      display:flex;
      align-items:center;
      gap:10px;
      color:white;
      font-size:18px;
    }

    input[type="range"]{
      cursor:pointer;
    }

    /* Buttons */

    button{
      padding:12px 22px;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    button:hover{
      opacity:0.85;
    }

    /* Updated Colors */

    .draw-btn{
      background:#f9a8d4;   /* Light Pink */
      color:black;
    }

    .eraser-btn{
      background:#8b5e3c;   /* Brown */
      color:white;
    }

    .clear-btn{
      background:#c4b5fd;   /* Light Purple */
      color:black;
    }

    /* Canvas Box */

    .canvas-container{
      width:92%;
      height:78vh;
      background:white;
      border:6px solid #38bdf8;
      border-radius:16px;
      padding:10px;
    }

    canvas{
      width:100%;
      height:100%;
      background:#f8fafc;
      border-radius:10px;
      cursor:crosshair;
    }

  </style>
</head>
<body>

  <!-- Toolbar -->

  <div class="toolbar">

    <!-- Brush Color -->

    <div class="color-box">
      <label>Brush Color</label>
      <input type="color" id="colorPicker" value="#000000">
    </div>

    <!-- Brush Size -->

    <div class="slider-box">
      <span>Brush Size</span>
      <input type="range" id="brushSize" min="1" max="40" value="5">
    </div>

    <!-- Buttons -->

    <button class="draw-btn" id="drawBtn">Draw</button>
    <button class="eraser-btn" id="eraserBtn">Eraser</button>
    <button class="clear-btn" id="clearBtn">Clear Canvas</button>

  </div>

  <!-- Canvas -->

  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const colorPicker = document.getElementById("colorPicker");
    const brushSize = document.getElementById("brushSize");
    const clearBtn = document.getElementById("clearBtn");
    const eraserBtn = document.getElementById("eraserBtn");
    const drawBtn = document.getElementById("drawBtn");

    // Canvas Size
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    let drawing = false;
    let erasing = false;

    // Default Brush Settings
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = brushSize.value;

    // Start Drawing
    canvas.addEventListener("mousedown", (e)=>{
      drawing = true;

      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });

    // Drawing
    canvas.addEventListener("mousemove", (e)=>{
      if(!drawing) return;

      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    });

    // Stop Drawing
    canvas.addEventListener("mouseup", ()=>{
      drawing = false;
    });

    canvas.addEventListener("mouseleave", ()=>{
      drawing = false;
    });

    // Change Brush Color
    colorPicker.addEventListener("input", ()=>{

      if(!erasing){
        ctx.strokeStyle = colorPicker.value;
      }

    });

    // Change Brush Size
    brushSize.addEventListener("input", ()=>{
      ctx.lineWidth = brushSize.value;
    });

    // Eraser
    eraserBtn.addEventListener("click", ()=>{

      erasing = true;
      ctx.strokeStyle = "#f8fafc";

    });

    // Draw Mode
    drawBtn.addEventListener("click", ()=>{

      erasing = false;
      ctx.strokeStyle = colorPicker.value;

    });

    // Clear Canvas
    clearBtn.addEventListener("click", ()=>{

      ctx.clearRect(0,0,canvas.width,canvas.height);

    });

  </script>

</body>
</html>
